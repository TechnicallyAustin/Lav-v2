[defaults]
inventory = ./inventory/dev.ini
roles_path = ./roles
host_key_checking = false
interpreter_python = /usr/bin/python3

[privilege_escalation]
become= true
become_method = sudo
become_ask_pass = false

[ssh_connection]
ssh_args = -o ServerAliveInterval=10 -o ServerAliveCountMax=5
pipelining = true


