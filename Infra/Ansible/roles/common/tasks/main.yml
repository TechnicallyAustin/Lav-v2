---
- name: Remove managed resolv.conf symlink
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  become: true

- name: Configure host DNS resolution
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 1.1.1.1
      nameserver 8.8.8.8
      nameserver 192.168.0.211
      search platform.local homelab
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120
  become: true

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: dist

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"

- name: Configure timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Disable networkd-wait-online (causes slow boot)
  ansible.builtin.systemd:
    name: systemd-networkd-wait-online
    enabled: false
    masked: true
  become: true

- name: Enable SSH server
  ansible.builtin.service:
    name: ssh
    enabled: true
    state: started

- name: Enable QEMU Guest Agent
  ansible.builtin.service:
    name: qemu-guest-agent
    enabled: true
    state: started
  when: not (is_lxc | default(false)) | bool

- name: Install Python Pip 3
  ansible.builtin.apt:
    name: pip
    state: present
    update_cache: true
  become: true

- name: Add local host alias for Authentik
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^192\.168\.0\.211\s+authentik\.platform\.local$'
    line: '192.168.0.211 authentik.platform.local'
    create: true
    state: present
  become: true
