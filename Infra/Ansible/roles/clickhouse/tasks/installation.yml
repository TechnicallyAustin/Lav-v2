---
# file: clickhouse/tasks/installation.yml

- name: Make sure the CA certificates are available
  ansible.builtin.apt:
    pkg: ca-certificates

- name: Add ClickHouse repository
  ansible.builtin.deb822_repository:
    name: clickhouse
    types: deb
    uris: https://packages.clickhouse.com/deb
    suites: stable
    components: main
    signed_by: "{{ clickhouse_apt_key_url }}"
    state: present
  register: __clickhouse_repo

- name: Refresh apt cache after adding ClickHouse repository
  ansible.builtin.apt:
    update_cache: true
  when: __clickhouse_repo.changed
  become: true

- name: Install ClickHouse packages
  ansible.builtin.apt:
    name: "{{ item.pkg }}"
    state: "{{ item.state }}"
  with_items:
    - "{{ clickhouse_apt_packages }}"
